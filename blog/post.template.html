<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="%%SUMMARY%%">
<meta name="ext-resource-dependency" content="../assets/skull-light-mode.gif">
<meta name="ext-resource-dependency" content="../assets/skull-dark-mode.gif">
<title>%%TITLE%% &mdash; Demilich Digital</title>
<script src="../theme.js"></script>
<script src="../support.js"></script>
</head>
<body>
<!-- Generated by blog/build.py from the matching .md file; edit that instead. -->
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; max-width: 100%; overflow-x: hidden; }
    * { box-sizing: border-box; }
    ::selection { background: #7F7F7F; color: #100016; }
    img { max-width: 100%; }

    /* Rendered Markdown. Colors come from the theme via custom properties on the page root. */
    [data-article-body] > :first-child { margin-top: 0; }
    [data-article-body] p { margin: 0 0 20px; }
    [data-article-body] a { color: var(--text-primary); }
    [data-article-body] strong { color: var(--text-primary); }
    [data-article-body] h2 { scroll-margin-top: 96px; font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 600; color: var(--text-primary); margin: 48px 0 20px; }
    [data-article-body] h3 { scroll-margin-top: 96px; font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600; color: var(--text-primary); margin: 36px 0 16px; }
    [data-article-body] blockquote { margin: 0 0 28px; padding: 4px 0 4px 20px; border-left: 3px solid var(--border); color: var(--text-primary); font-style: italic; }
    [data-article-body] blockquote p { margin: 0; }
    [data-article-body] ul, [data-article-body] ol { margin: 0 0 20px; padding-left: 22px; }
    [data-article-body] li { margin-bottom: 14px; }
    [data-article-body] code { font-family: 'IBM Plex Mono', monospace; font-size: 0.88em; background: var(--card-bg); border: 1px solid var(--border); padding: 1px 5px; border-radius: 2px; }
    [data-article-body] pre { background: var(--card-bg); border: 1px solid var(--border); padding: 16px 20px; overflow-x: auto; margin: 0 0 24px; }
    [data-article-body] pre code { background: none; border: none; padding: 0; font-size: 14px; }

    @media (max-width: 720px) {
      [data-nav] { padding: 14px 20px !important; flex-wrap: wrap; row-gap: 12px; }
      [data-nav-links] { gap: 10px 18px !important; max-width: 100%; font-size: 12px !important; }

      [data-screen-label="PostHero"] { padding: 72px 20px 56px !important; }
      [data-screen-label="PostHero"] h1 { font-size: 30px !important; }
      [data-screen-label="PostHero"] p { font-size: 16px !important; }

      [data-screen-label="Article"] { padding: 56px 20px !important; }
      [data-screen-label="Article"] h2 { font-size: 22px !important; }
      [data-screen-label="Article"] blockquote { padding: 16px 20px !important; font-size: 17px !important; }

      [data-footer] { flex-direction: column; gap: 8px; text-align: center; padding: 24px 20px !important; }
    }

    /* The outline lives in the left gutter; once the gutter is too narrow to hold it, drop it. */
    @media (max-width: 1279px) {
      [data-outline] { display: none !important; }
      [data-screen-label="Article"] { grid-template-columns: minmax(0, 760px) !important; justify-content: center; column-gap: 0 !important; }
      [data-article-body] { grid-column: 1 !important; }
    }

    @media (max-width: 420px) {
      [data-screen-label="PostHero"] h1 { font-size: 25px !important; }
      [data-nav-title] { font-size: 14px !important; }
    }
  </style>
</helmet>

<div style="--text-primary:{{ t.textPrimary }}; --border:{{ t.border }}; --card-bg:{{ t.cardBg }}; background:{{ t.bg }}; color:{{ t.textPrimary }}; font-family:'IBM Plex Sans', sans-serif; min-height:100vh; width:100%; transition:background 0.25s ease, color 0.25s ease;">

  <!-- NAV -->
  <x-import from="../nav.js" component="Nav" t="{{ t }}" toggle-theme="{{ toggleTheme }}" root="../"></x-import>

  <!-- HERO -->
  <div data-screen-label="PostHero" style="position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; padding:100px 24px 72px; overflow:hidden; border-bottom:1px solid {{ t.border }};">
    <div style="position:absolute; inset:0; background-image: linear-gradient({{ t.gridLine }} 1px, transparent 1px), linear-gradient(90deg, {{ t.gridLine }} 1px, transparent 1px); background-size: 40px 40px; opacity:0.35; pointer-events:none;"></div>
    <div style="position:relative; font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.2em; color:{{ t.textMuted }}; text-transform:uppercase; margin-bottom:20px;"><a href="../index.html#blog" style="color:{{ t.textMuted }};">Blog</a> &mdash; <time datetime="%%DATE_ISO%%">%%DATE%%</time></div>
    <h1 style="position:relative; font-family:'IBM Plex Mono', monospace; font-size:48px; font-weight:600; line-height:1.15; color:{{ t.textPrimary }}; max-width:760px; margin:0 0 24px;">%%TITLE%%</h1>
    <p style="position:relative; font-family:'IBM Plex Sans', sans-serif; font-size:18px; line-height:1.6; color:{{ t.textSecondary }}; max-width:680px; margin:0;">%%SUMMARY%%</p>
  </div>

  <!-- ARTICLE -->
  <div data-screen-label="Article" style="display:grid; grid-template-columns:1fr minmax(0, 760px) 1fr; column-gap:48px; align-items:start; padding:96px 48px;">

    <!-- OUTLINE -->
    <nav data-outline style="grid-column:1; justify-self:end; width:100%; max-width:220px; position:sticky; top:96px;">
      <div data-outline-title style="font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.15em; text-transform:uppercase; color:{{ t.textMuted }}; margin-bottom:16px;">On this page</div>
      <ol data-outline-list style="margin:0; padding-left:20px; display:flex; flex-direction:column; gap:10px; font-family:'IBM Plex Mono', monospace; font-size:13px;">
%%OUTLINE%%
      </ol>
    </nav>

    <div data-article-body style="grid-column:2; min-width:0; font-size:18px; line-height:1.75; color:{{ t.textSecondary }};">
%%BODY%%
    </div>
  </div>

  <!-- FOOTER -->
  <div data-footer style="display:flex; align-items:center; justify-content:space-between; padding:28px 48px; border-top:1px solid {{ t.border }}; font-family:'IBM Plex Mono', monospace; font-size:12px; color:{{ t.textMuted }};">
    <span>&copy; 2026 Demilich Digital LLC</span>
    <a href="../index.html" style="color:{{ t.textMuted }};">demilich.digital</a>
  </div>

</div>

</x-dc>
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#100016"/><text x="50" y="62" font-family="monospace" font-size="34" font-weight="bold" fill="#EDE7EA" text-anchor="middle">DD</text></svg>
</template>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { theme: (this.props && this.props.theme) || (window.DemilichTheme ? window.DemilichTheme.get() : 'dark') };

  toggleTheme = () => {
    this.setState(s => {
      const next = s.theme === 'dark' ? 'light' : 'dark';
      if (window.DemilichTheme) window.DemilichTheme.set(next);
      return { theme: next };
    });
  };

  renderVals() {
    const dark = {
      bg: '#100016', navBg: 'rgba(16,0,22,0.85)', cardBg: '#150019', aboutBg: '#0C0010',
      border: '#2A0E36', gridLine: '#1E0A28',
      textPrimary: '#FFFFFF', textSecondary: '#D6CEDB', textMuted: '#A79DAE',
      btnBg: '#EDE7EA', btnText: '#100016',
      darkLogoDisplay: 'block', lightLogoDisplay: 'none',
      toggleLabel: 'LIGHT MODE'
    };
    const light = {
      bg: '#F4F0F2', navBg: 'rgba(244,240,242,0.88)', cardBg: '#FFFFFF', aboutBg: '#EAE2E7',
      border: '#D9D0DA', gridLine: '#E3DAE1',
      textPrimary: '#170022', textSecondary: '#4A3856', textMuted: '#7F7F7F',
      btnBg: '#170022', btnText: '#F4F0F2',
      darkLogoDisplay: 'none', lightLogoDisplay: 'block',
      toggleLabel: 'DARK MODE'
    };
    const t = this.state.theme === 'dark' ? dark : light;
    return { t, toggleTheme: this.toggleTheme };
  }
}

</script>
</body>
</html>
